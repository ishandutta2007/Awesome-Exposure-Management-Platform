<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Pulsing Node Animation -->
    <style>
      .pulse-node {
        animation: pulse 3s infinite alternate ease-in-out;
      }
      .pulse-node-delayed {
        animation: pulse 4s infinite alternate ease-in-out 1.5s;
      }
      .scan-line {
        animation: scan 6s infinite linear;
      }
      .radar-sweep {
        transform-origin: 1000px 180px;
        animation: spin 10s infinite linear;
      }
      @keyframes pulse {
        0% { r: 4px; opacity: 0.4; }
        100% { r: 9px; opacity: 0.9; }
      }
      @keyframes scan {
        0% { transform: translateY(0px); opacity: 0.1; }
        50% { opacity: 0.4; }
        100% { transform: translateY(360px); opacity: 0.1; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>

  <!-- Background Animated Network Grid / Nodes (Strictly Background) -->
  <g opacity="0.25">
    <circle cx="1000" cy="180" r="140" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1000" cy="180" r="90" fill="none" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="1000" cy="180" r="40" fill="none" stroke="#ec4899" stroke-width="1.5"/>

    <!-- Radar Line -->
    <line x1="1000" y1="180" x2="1140" y2="180" stroke="#a855f7" stroke-width="2" class="radar-sweep"/>

    <!-- Background Connectors -->
    <path d="M 150,60 L 300,120 L 450,40 M 800,80 L 1000,180 L 850,280 M 100,280 L 250,220 L 400,310" stroke="#818cf8" stroke-width="1" fill="none"/>
    
    <!-- Nodes -->
    <circle cx="150" cy="60" class="pulse-node" fill="#a855f7"/>
    <circle cx="300" cy="120" class="pulse-node-delayed" fill="#6366f1"/>
    <circle cx="450" cy="40" class="pulse-node" fill="#ec4899"/>
    <circle cx="800" cy="80" class="pulse-node-delayed" fill="#6366f1"/>
    <circle cx="850" cy="280" class="pulse-node" fill="#a855f7"/>
    <circle cx="250" cy="220" class="pulse-node-delayed" fill="#ec4899"/>
  </g>

  <!-- Ambient Glow Behind Text -->
  <circle cx="420" cy="170" r="280" fill="url(#glow)"/>

  <!-- Foreground Title and Subtitle (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Security Tag / Badge -->
    <rect x="0" y="65" width="280" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1"/>
    <text x="14" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.5">🛡️ CYBERSECURITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Exposure Management
    </text>
    
    <!-- Gradient Highlight Bar -->
    <rect x="0" y="172" width="620" height="6" rx="3" fill="url(#accent)"/>

    <!-- Subtitle -->
    <text x="0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
      Curated SaaS Platforms &amp; Open-Source Projects
    </text>

    <!-- Pill Badges -->
    <g transform="translate(0, 248)">
      <!-- ASM Pill -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🎯 Attack Surface</text>

      <!-- CAASM Pill -->
      <rect x="172" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="186" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#c084fc">🔍 CAASM</text>

      <!-- Vulnerabilities Pill -->
      <rect x="314" y="0" width="190" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="328" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#f472b6">⚡ Risk Prioritization</text>
    </g>
  </g>
</svg>
